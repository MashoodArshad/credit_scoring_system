[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

# ------------------------------------------------------------ #
# Project metadata + installable package definition             #
# Makes `src/` an importable package:  `from src.config ...`    #
# ------------------------------------------------------------ #
[project]
name = "credit_scoring"
version = "0.1.0"
description = "Production-ready credit scoring system using machine learning."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ML Team" }]
keywords = ["credit-scoring", "machine-learning", "risk", "classification"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "imbalanced-learn>=0.11",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "catboost>=1.2",
    "shap>=0.43",
    "lime>=0.2",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "plotly>=5.15",
    "joblib>=1.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.5",
    "jupyterlab>=4.0",
    "ipykernel>=6.25",
    "nbstripout>=0.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# ------------------------- Ruff (lint + format) ------------------------- #
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks", "data", "models", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]  # pyflakes, pycodestyle, isort, bugbear, pyupgrade, naming
ignore = ["E501"]  # line length handled by formatter

# ------------------------- Pytest ------------------------- #
[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

# ------------------------- Mypy ------------------------- #
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
exclude = "notebooks/"
